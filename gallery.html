
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Liberty County RP – Galerie</title>
  <style>
    :root{
      --bg: #0b1220;
      --bg-soft: #111b2d;
      --panel: rgba(16,24,39,0.88);
      --text: #eaf3ff;
      --muted: #b9c8dc;
      --border: rgba(148,163,184,0.2);
      --accent: #45a5ff;
      --btn-bg: linear-gradient(135deg, #2f8dff, #0b74d1);
      --shadow: 0 18px 42px rgba(1, 6, 16, 0.38);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Segoe UI, Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(69,165,255,0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(16,185,129,0.12), transparent 22%),
        linear-gradient(180deg, #09111d 0%, #0d1727 35%, #0c1523 100%);
      color: var(--text);
      line-height: 1.45;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(2rem, 3vw, 2.6rem);
      letter-spacing: -0.04em;
    }
    .message-box {
      margin-top: 24px;
      padding: 32px 24px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(17,29,46,0.95), rgba(10,18,29,0.82));
      border: 1px solid var(--border);
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      box-shadow: var(--shadow);
      color: var(--text);
    }
    a.back {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 18px;
      background: var(--btn-bg);
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      box-shadow: 0 12px 28px rgba(11,116,209,0.35);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    a.back:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(11,116,209,0.42);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Galerie – Liberty County RP</h1>
    <div class="message-box">Under Construction, weiter Bilder folgen bald</div>
    <a class="back" href="index.html">Zurück zur Hauptseite</a>
  </div>
</body>
</html>
